# TPT Construction — workspace root manifest.
#
# NOTE: The design doc (spec.txt §6) defines a [patch.crates-io] section pointing
# at local sibling checkouts of `tpt-math` / `tpt-engineering`. Those repositories
# are not present in every environment, so patches are intentionally omitted here.
# Crates in this workspace are self-contained until those substrates are published
# or vendored locally.

[workspace]
resolver = "2"
# NOTE: the project is implemented phase-by-phase. Auto-generated stub crates
# for not-yet-implemented phases (cost, workflow, schedule, ...) may exist on
# disk but are intentionally excluded here so that `cargo` only builds the
# crates that are actually implemented and green. Expand this list as each
# phase lands (see todo.md).
members = [
    "crates/tpt-c-core",
    "crates/tpt-c-ids",
    "crates/tpt-c-units",
    "crates/tpt-c-classification",
    "crates/tpt-c-model",
    "crates/tpt-c-geometry",
    "crates/tpt-c-geo",
    "crates/tpt-c-ifc",
    "crates/tpt-c-bcf",
    "crates/tpt-c-gltf",
    "crates/tpt-c-schedule",
    "crates/tpt-c-risk",
    "crates/tpt-c-earned-value",
    "crates/tpt-c-earthwork",
    "crates/tpt-c-alignment",
    "crates/tpt-c-quantities",
    "crates/tpt-c-cost",
    "crates/tpt-c-estimating",
    "crates/tpt-c-csv",
    "crates/tpt-c-xlsx",
    "crates/tpt-c-workflow",
    "crates/tpt-c-field",
    "crates/tpt-c-documents",
    "crates/tpt-c-contracts",
    "crates/tpt-c-payapps",
    "crates/tpt-c-safety",
    "crates/tpt-c-fm",
    "crates/tpt-c-assets",
    "crates/tpt-c-maintenance",
    "crates/tpt-c-twin",
    "crates/tpt-c-space",
    "examples/ifc-import",
    "examples/cpm-schedule",
    "examples/quantity-takeoff",
    "examples/estimate-export",
    "examples/field-execution-e2e",
    "examples/field-offline-sync",
     "examples/earthwork-cut-fill",
     "examples/tpt",
     "examples/wasm-browser-demo",
     "crates/tpt-c-wasm",
     "crates/tpt-c-api",
 ]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-construction"
authors = ["TPT Solutions"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# ---------------------------------------------------------------------------
# External dependencies.
# License policy (spec §4): prefer an MIT-selectable chain. Everything below is
# dual-licensed MIT OR Apache-2.0. Any Apache-only dependency must be isolated
# behind an optional feature and documented.
# ---------------------------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "v5", "std", "serde", "js"] }
# External XML dependency used by format crates (cached offline).
quick-xml = "0.22"
calamine = "0.24"
# xlsx writing: hand-rolled OOXML + zip, feature-pinned to avoid the
# Apache-2.0-only `zopfli` crate that `zip`'s bundled "deflate" feature
# otherwise drags in (see crates/tpt-c-xlsx). `deflate-flate2` alone only
# activates the `flate2` dependency starting at zip 4.x; the actual backend
# (rust_backend/miniz_oxide) is chosen by our own `flate2` feature below.
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

# ---------------------------------------------------------------------------
# Internal crates (path dependencies, inherited by members on demand).
# ---------------------------------------------------------------------------
tpt-c-core = { path = "crates/tpt-c-core", version = "0.1.0" }
tpt-c-ids = { path = "crates/tpt-c-ids", version = "0.1.0" }
tpt-c-units = { path = "crates/tpt-c-units", version = "0.1.0" }
tpt-c-classification = { path = "crates/tpt-c-classification", version = "0.1.0" }
